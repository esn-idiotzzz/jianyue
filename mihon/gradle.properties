kotlin.code.style=official

# Keep Kotlin compilation inside the Gradle JVM. The sandboxed Windows runner cannot reliably
# create the Kotlin daemon's client marker under %LOCALAPPDATA%\kotlin.
kotlin.compiler.execution.strategy=in-process

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# The project folder name is Chinese; AGP's ASCII path guard is not relevant on modern Windows.
android.overridePathCheck=true
